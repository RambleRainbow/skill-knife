<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Markets</title>
    <!-- CSS_URIS -->
</head>

<body>
    <div class="header">
        <div class="market-bar">
            <h1>Skill Markets</h1>
            <div class="market-controls">
                <select id="marketSelect">
                    <!-- Options rendered by JS -->
                </select>
            </div>
        </div>

        <div class="action-bar">
            <input type="text" class="search-box" placeholder="Search skills..." id="searchInput">

            <div class="tools-group">

                    </svg>
                </button>
                <button class="icon-btn" id="settingsBtn" title="Installation Settings">
                    <svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
                        <path d="M9.1 14.4L8.7 12.9C8.9 12.8 9.1 12.7 9.3 12.5L10.7 13.1C10.9 13.2 11.1 13.1 11.2 12.9L12.3 11C12.4 10.8 12.3 10.6 12.1 10.5L10.9 9.6C10.9 9.4 11 9.2 11 9C11 8.8 11 8.6 10.9 8.4L12.1 7.5C12.3 7.4 12.4 7.2 12.3 7L11.2 5.1C11.1 4.9 10.9 4.8 10.7 4.9L9.3 5.5C9.1 5.3 8.9 5.2 8.7 5.1L9.1 3.6C9.1 3.4 9 3.2 8.8 3.2H6.6C6.4 3.2 6.3 3.3 6.3 3.6L6.7 5.1C6.5 5.2 6.3 5.3 6.1 5.5L4.7 4.9C4.5 4.8 4.3 4.9 4.2 5.1L3.1 7C3 7.2 3.1 7.4 3.3 7.5L4.5 8.4C4.4 8.6 4.4 8.8 4.4 9C4.4 9.2 4.4 9.4 4.5 9.6L3.3 10.5C3.1 10.6 3 10.8 3.1 11L4.2 12.9C4.3 13.1 4.5 13.2 4.7 13.1L6.1 12.5C6.3 12.7 6.5 12.8 6.7 12.9L6.3 14.4C6.3 14.6 6.4 14.8 6.6 14.8H8.8C9 14.8 9.1 14.7 9.1 14.4ZM7.7 11.5C6.3 11.5 5.2 10.4 5.2 9C5.2 7.6 6.3 6.5 7.7 6.5C9.1 6.5 10.2 7.6 10.2 9C10.2 10.4 9.1 11.5 7.7 11.5Z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <div id="skills-container" class="skills-list">
        <!-- Skills rendered by JS -->
        <div class="loading">Initializing...</div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <h3 style="margin-top:0">Default Install Targets</h3>
            <div style="font-size:0.9em; color:var(--vscode-descriptionForeground)">Select which agents to install
                skills to by default.</div>
            <div id="agent-list" class="agent-list">
                <!-- Agents rendered by JS -->
            </div>
            <div class="modal-actions">
                <button id="cancelSettingsBtn">Cancel</button>
                <button id="saveSettingsBtn"
                    style="background:var(--vscode-button-background); color:var(--vscode-button-foreground)">Save</button>
            </div>
        </div>
    </div>

    <script>
        // Initial State Placeholder
        /* INITIAL_DATA */
    </script>
    <!-- SCRIPT_URIS -->
</body>

</html>
